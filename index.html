<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Priority Assistant</title>
<style>
:root{
  --bg:#081012; --panel:#0d1719; --panel2:#111e21; --line:#223236;
  --text:#f3f6f6; --muted:#8ea0a4; --teal:#3aa2a5; --teal2:#17474b;
  --danger:#c65d5d; --shadow:0 16px 38px rgba(0,0,0,.36);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}
body{min-height:100dvh}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{width:min(100%,520px);margin:0 auto;min-height:100dvh;background:var(--bg);padding-bottom:max(24px,env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 12px;background:rgba(8,16,18,.96);backdrop-filter:blur(12px);border-bottom:1px solid #132326}
.brand{font-size:19px;font-weight:800;letter-spacing:-.02em}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.iconBtn,.btn,.smallBtn{border:1px solid var(--line);background:#101b1e;color:var(--text);border-radius:12px;min-height:44px;padding:10px 13px;cursor:pointer}
.iconBtn{min-width:44px;padding:8px 11px}.btn.primary{background:var(--teal2);border-color:#2d777b}.btn.danger{color:#efb0b0;border-color:#5b3030;background:#221516}.smallBtn{min-height:34px;padding:5px 9px;border-radius:9px;font-size:12px}
main{padding:12px;display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.cardHead{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-bottom:1px solid var(--line)}
.cardHead h2{margin:0;font-size:15px}.muted{color:var(--muted)}
.mapWrap{padding:8px 8px 2px}.mapTap{display:block;width:100%;border:0;background:transparent;padding:0;cursor:pointer}.mapStage{width:100%;aspect-ratio:1/1;display:grid;place-items:center}.mapFooter{padding:0 12px 12px}.mapFooter .btn{width:100%}
.blankCircle{width:88%;aspect-ratio:1/1;border:1px dashed #33484d;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:34px;line-height:1.4}
.prioritySvg{width:100%;height:100%;display:block}.prioritySvg text{fill:#f6f8f8;font-weight:650;pointer-events:none}.prioritySvg .titleText{font-size:11px;font-weight:800}.prioritySvg .actionText{font-size:7.5px}.prioritySvg .cell{stroke:#071012;stroke-width:1.5}.prioritySvg .divider{stroke:#050a0b;stroke-width:2}.prioritySvg .heartLine{stroke:#050a0b;stroke-width:2}
.calendarTools{display:flex;gap:6px}.calendarTools .smallBtn{min-width:34px}.monthTitle{font-size:14px;font-weight:700}
.weekdays,.monthGrid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays{padding:8px 8px 4px;color:#73888d;font-size:10px;text-align:center}.monthGrid{padding:0 7px 8px;gap:3px}.dayCell{min-height:76px;border:1px solid #16272a;background:#0a1416;border-radius:10px;padding:5px;overflow:hidden;cursor:pointer;position:relative}.dayCell.out{opacity:.38}.dayCell.selected{border-color:#2d7478;background:#102327}.dayNum{font-size:10px;color:#9aabad;margin-bottom:3px}.dayCell.today .dayNum{color:#67c4c7;font-weight:800}.miniTask{width:100%;display:flex;align-items:center;gap:3px;border:0;border-left:3px solid var(--taskColor,#4d7f66);background:#101b1d;color:#dfe7e8;border-radius:4px;margin-top:2px;padding:2px 3px;font-size:7.5px;line-height:1.2;text-align:left;cursor:pointer;overflow:hidden}.miniTask.done{text-decoration:line-through;opacity:.55}.miniCheck{font-size:7px;flex:0 0 auto}.miniLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.more{font-size:7.5px;color:#71898d;margin-top:3px}
.todoBody{max-height:430px;overflow:auto;padding:4px 12px 12px}.dateHeading{font-size:13px;color:var(--teal);font-weight:750;padding:8px 0 5px}.timeGroup{font-size:11px;color:#788d91;font-weight:700;margin:9px 0 3px}.todoRow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--text);padding:9px 0;text-align:left;border-bottom:1px solid #162528;cursor:pointer}.todoCheck{width:22px;height:22px;border:1px solid #5b696c;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;font-size:13px}.todoRow.done .todoCheck{border-color:#597e69;background:#173223}.todoRow.done .todoLabel{text-decoration:line-through;color:#718387}.todoAccent{width:5px;height:28px;border-radius:4px;background:var(--taskColor,#4d7f66);flex:0 0 auto}.todoLabel{font-size:14px;min-width:0;flex:1}.emptyTodo{padding:24px 4px;color:var(--muted);text-align:center;font-size:13px}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{width:min(100%,520px);max-height:94dvh;overflow:auto;background:#0b1416;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding-bottom:max(16px,env(safe-area-inset-bottom))}.sheet.full{height:100dvh;max-height:100dvh;border-radius:0;border:0}.sheetHead{position:sticky;top:0;z-index:3;background:#0b1416;border-bottom:1px solid var(--line);padding:max(14px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.sheetHead h2{font-size:18px;margin:0}.sheetBody{padding:14px}.label{display:block;font-size:11px;color:#8fa1a5;margin-bottom:5px}.field{width:100%;border:1px solid #25363a;background:#0c181a;color:var(--text);border-radius:11px;min-height:44px;padding:9px 10px}.field::placeholder{color:#576a6e}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.setupControls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.sectionCard{border:1px solid var(--line);border-radius:15px;background:#0d181a;overflow:hidden;margin-bottom:10px}.sectionHead{padding:9px;background:#102124;display:flex;gap:8px;align-items:center}.sectionName{flex:1;background:transparent;border:0;border-bottom:1px solid #285358;color:#58bfc2;font-weight:800;padding:6px 4px;min-width:0}.actionRow{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid #1b2a2e}.actionMain{flex:1;min-width:0;cursor:pointer}.actionTitle{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scheduleText{font-size:10px;color:#819397;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layerDot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}.rowBtns{display:flex;gap:4px}.addAction{width:100%;border:0;border-top:1px solid #1b2a2e;background:#0b1517;color:#5fbfc2;padding:11px;cursor:pointer;text-align:left}.setupFooter{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(11,20,22,0),#0b1416 25%);padding:18px 14px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px}.setupFooter .btn{width:100%}
.repeatDays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dayPick{min-height:38px;border:1px solid #2a3a3e;border-radius:9px;background:#0d181a;color:#9aabad;cursor:pointer}.dayPick.active{background:#15383c;color:#68c4c7;border-color:#377f83}.formSection{margin-top:12px}.formActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.settingsChoice{display:grid;gap:9px}.choiceBtn{width:100%;text-align:left;border:1px solid var(--line);background:#0e191b;color:var(--text);border-radius:14px;padding:14px;cursor:pointer}.choiceBtn strong{display:block;font-size:14px}.choiceBtn span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:#173237;border:1px solid #2b666b;color:#dff6f6;padding:9px 12px;border-radius:12px;font-size:12px;display:none}.toast.show{display:block}
@media (max-width:390px){.dayCell{min-height:68px}.prioritySvg .actionText{font-size:7px}.setupControls{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#101514">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Priority Assistant">

</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div><div class="brand">Priority Map</div><div class="sub">Map → tasks → calendar</div></div>
    <button class="iconBtn" id="settingsButton" type="button" data-action="open-settings">Settings</button>
  </header>

  <main>
    <section class="card" aria-label="Priority map">
      <div class="mapWrap">
        <button class="mapTap" id="mapTap" type="button" data-action="open-setup">
          <div class="mapStage" id="mapStage"></div>
        </button>
      </div>
      <div class="mapFooter"><button class="btn" id="editMapHome" type="button" data-action="open-setup">Edit map</button></div>
    </section>

    <section class="card" id="calendarCard">
      <div class="cardHead">
        <div><div class="monthTitle" id="monthTitle"></div><div class="muted" style="font-size:10px">Tap a date or task</div></div>
        <div class="calendarTools">
          <button class="smallBtn" type="button" data-action="prev-month">‹</button>
          <button class="smallBtn" type="button" data-action="today">Today</button>
          <button class="smallBtn" type="button" data-action="next-month">›</button>
        </div>
      </div>
      <div class="weekdays"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
      <div class="monthGrid" id="monthGrid"></div>
    </section>

    <section class="card" id="todoCard">
      <div class="cardHead"><h2>To-do</h2><div class="muted" id="todoCount" style="font-size:11px"></div></div>
      <div class="todoBody" id="todoBody"></div>
    </section>
  </main>
</div>

<!-- SETTINGS -->
<div class="overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="sheet">
    <div class="sheetHead"><h2>Settings</h2><button class="btn" type="button" data-action="close-settings">Close</button></div>
    <div class="sheetBody">
      <div class="settingsChoice">
        <button class="choiceBtn" type="button" data-action="load-my-layout"><strong>My layout</strong><span>Load the 6-section × 7-actionable test layout.</span></button>
        <button class="choiceBtn" type="button" data-action="load-blank-layout"><strong>Blank layout</strong><span>Start a new customizable priority map.</span></button>
      </div>
    </div>
  </div>
</div>

<!-- MAP SETUP -->
<div class="overlay" id="setupOverlay" role="dialog" aria-modal="true" aria-label="Priority map setup">
  <div class="sheet full">
    <div class="sheetHead">
      <div><h2>Build your map</h2><div class="muted" style="font-size:11px">Sections + actionables + schedules</div></div>
      <button class="btn" type="button" data-action="setup-done">Done</button>
    </div>
    <div class="sheetBody">
      <div class="setupControls">
        <div><label class="label" for="sectionCount">Sections</label><select class="field" id="sectionCount"><option value="4">4</option><option value="6">6</option><option value="8">8</option></select></div>
        <div><label class="label" for="layerCount">Actionables / section</label><input class="field" id="layerCount" type="number" min="1" max="12" inputmode="numeric" /></div>
      </div>
      <div id="sectionEditor"></div>
    </div>
    <div class="setupFooter">
      <button class="btn" type="button" data-action="setup-home">Home</button>
      <button class="btn primary" type="button" data-action="setup-done">Save & Home</button>
    </div>
  </div>
</div>

<!-- ACTION EDITOR -->
<div class="overlay" id="actionOverlay" role="dialog" aria-modal="true" aria-label="Actionable editor">
  <div class="sheet">
    <div class="sheetHead"><h2 id="actionEditorTitle">Actionable</h2><button class="btn" type="button" data-action="close-action">Close</button></div>
    <div class="sheetBody">
      <input type="hidden" id="actionId" />
      <input type="hidden" id="actionSectionId" />

      <div><label class="label" for="actionName">Actionable</label><input class="field" id="actionName" placeholder="e.g. Gym" /></div>

      <div class="grid2 formSection">
        <div><label class="label" for="startDate">Start date</label><input class="field" id="startDate" type="date" /></div>
        <div><label class="label" for="actionTime">Time</label><input class="field" id="actionTime" type="time" /></div>
      </div>

      <div class="formSection"><label class="label" for="repeatType">Repeat</label>
        <select class="field" id="repeatType">
          <option value="none">No schedule</option>
          <option value="once">Does not repeat</option>
          <option value="daily">Every day</option>
          <option value="weekly">Every week</option>
          <option value="custom">Custom</option>
        </select>
      </div>

      <div class="formSection" id="weeklyBlock" hidden>
        <label class="label">Repeat on</label>
        <div class="repeatDays" id="repeatDays">
          <button class="dayPick" type="button" data-action="pick-day" data-day="0">S</button>
          <button class="dayPick" type="button" data-action="pick-day" data-day="1">M</button>
          <button class="dayPick" type="button" data-action="pick-day" data-day="2">T</button>
          <button class="dayPick" type="button" data-action="pick-day" data-day="3">W</button>
          <button class="dayPick" type="button" data-action="pick-day" data-day="4">T</button>
          <button class="dayPick" type="button" data-action="pick-day" data-day="5">F</button>
          <button class="dayPick" type="button" data-action="pick-day" data-day="6">S</button>
        </div>
      </div>

      <div class="grid2 formSection" id="customBlock" hidden>
        <div><label class="label" for="repeatEvery">Repeat every</label><input class="field" id="repeatEvery" type="number" min="1" max="99" value="1" inputmode="numeric" /></div>
        <div><label class="label" for="repeatUnit">Unit</label><select class="field" id="repeatUnit"><option value="day">day(s)</option><option value="week">week(s)</option></select></div>
      </div>

      <div class="formSection" id="endBlock" hidden>
        <label class="label" for="endType">Ends</label>
        <select class="field" id="endType"><option value="never">Never</option><option value="date">On date</option></select>
      </div>
      <div class="formSection" id="endDateBlock" hidden><label class="label" for="endDate">End date</label><input class="field" id="endDate" type="date" /></div>

      <div class="formSection"><label class="label" for="actionNotes">Notes</label><textarea class="field" id="actionNotes" rows="2" placeholder="Optional"></textarea></div>

      <div class="formActions">
        <button class="btn danger" id="deleteActionBtn" type="button" data-action="delete-action">Delete</button>
        <button class="btn primary" type="button" data-action="save-action">Save actionable</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const STORAGE_KEY='priority-map-rebuild-v1';
const DONE_KEY='priority-map-done-v1:';
const $=id=>document.getElementById(id);
const clone=x=>JSON.parse(JSON.stringify(x));
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const diffDays=(a,b)=>Math.floor((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
const uid=()=>`id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;

const SOURCE_ACTIONS=[
['IHSAN','Prayer','×7','Daily'],['IHSAN','Family','Check Each','Weekly'],['IHSAN','Income (Zakāt)','x1 Finan/$20','Daily/Weekly'],['IHSAN','Rights','—','All Time'],['IHSAN','Avoid Ḥarām','Quit Yesterday','All Time'],['IHSAN','Ramadan','Plan in Jan','Ramadan'],['IHSAN','Ḥajj/Ummrah','Plan in Jan','Both Once'],
['ḤASANAH','Qur’an','×2','Daily'],['ḤASANAH','Duʿā','×2','Daily'],['ḤASANAH','Surah Al-Baqarah','×1','3 Days'],['ḤASANAH','Seerah','×1 (w/Notes)','Weekly'],['ḤASANAH','Fasting','×2','Weekly'],['ḤASANAH','Tahajjud','×7','Weekly'],['ḤASANAH','Dhikr','5 min','Daily'],
['ṢABR','Āyat al-Kursī','Min ×7','Daily'],['ṢABR','Standard Routines','All in Calendar','All Time'],['ṢABR','Control Eating','—','All Time'],['ṢABR','Sleep Early','Isha Bedtime','Daily'],['ṢABR','Supplements','×2','Daily'],['ṢABR','Stretching / Knee Recovery','×1','Daily'],['ṢABR','Gym','×2','Weekly'],
['ʿAQL','Study Islam','×1 (w/Notes)','Weekly'],['ʿAQL','Grow Business','×1','Daily'],['ʿAQL','Read','Min ×2','Daily'],['ʿAQL','Fix Speech (Written)','Learn Techniques','Weekly'],['ʿAQL','Tafsīr','×1','Weekly'],['ʿAQL','Philosophy','×1','Weekly'],['ʿAQL','Learn Arabic','10 min','Daily'],
['WAQT','Friends','Min ×1','Weekly / Asked'],['WAQT','Feed Poor','×1','Opportunity'],['WAQT','Serve General','—','Opportunity'],['WAQT','Riley','×1','2 Weeks'],['WAQT','Community','Apply Sunday / ×1','2 Weeks'],['WAQT','Neighbours','Pleasantries','Opportunity'],['WAQT','Mosque','×1','Weekly'],
['NIYYA','Recitation','×1','Weekly'],['NIYYA','Pre-Speech Breath','—','All Time'],['NIYYA','Avoid Backbiting','—','All Time'],['NIYYA','Breathwork','×10','Daily'],['NIYYA','Gratitude','—','Nightly'],['NIYYA','Check Desire','—','All Time'],['NIYYA','Less Phone (Check)','Limit Apps','All Time']
];
const SECTION_ORDER=['IHSAN','ḤASANAH','ṢABR','ʿAQL','WAQT','NIYYA'];

function schedule(type,start='2026-09-01',time='',extra={}){return {type,startDate:start,time,interval:1,unit:'day',weekdays:[],endType:'never',endDate:'',...extra};}
function presetSchedule(category,name,notes,freq){
  const weekly={
    'Family':[3],'Seerah':[2],'Fasting':[4,0],'Gym':[5,0],'Study Islam':[1],'Fix Speech (Written)':[5],
    'Tafsīr':[2],'Philosophy':[4],'Friends':[3],'Mosque':[5],'Recitation':[1]
  };
  const timeMap={'Duʿā':'05:15','Dhikr':'05:15','Tahajjud':'05:15','Learn Arabic':'09:30','Gratitude':'22:00','Āyat al-Kursī':'22:00','Sleep Early':'22:30'};
  if(freq==='Daily'||freq==='Nightly') return schedule('daily','2026-09-01',timeMap[name]||'');
  if(name==='Tahajjud') return schedule('daily','2026-09-01','05:15');
  if(freq==='Weekly'||freq==='Weekly / Asked') return schedule('weekly','2026-09-01','',{weekdays:weekly[name]||[1]});
  if(freq==='3 Days') return schedule('custom','2026-09-01','',{interval:3,unit:'day'});
  if(freq==='2 Weeks'){
    const isCommunity=name==='Community';
    return schedule('custom',isCommunity?'2026-09-13':'2026-09-08','',{interval:2,unit:'week',weekdays:[isCommunity?0:2]});
  }
  if(freq==='Daily/Weekly') return schedule('daily','2026-09-01','');
  return schedule('none','2026-09-01','');
}
function makeBlankModel(){
  return {version:1,layout:'blank',sectionCount:6,layerCount:7,sections:Array.from({length:8},(_,i)=>({id:`section-${i+1}`,name:`Section ${i+1}`,actions:[]})),extras:[]};
}
function makeMyLayout(){
  const sections=SECTION_ORDER.map((name,i)=>({id:`preset-section-${i+1}`,name,actions:[]}));
  SOURCE_ACTIONS.forEach(([cat,name,notes,freq])=>{
    const s=sections.find(x=>x.name===cat);
    s.actions.push({id:`preset-${cat}-${s.actions.length+1}`,name,notes,sourceFrequency:freq,schedule:presetSchedule(cat,name,notes,freq)});
  });
  while(sections.length<8)sections.push({id:`preset-section-${sections.length+1}`,name:`Section ${sections.length+1}`,actions:[]});
  const extras=[
    ['Fajr','05:15','daily'],['Morning Routine','09:30','daily'],['Coffee','09:30','daily'],['Read Quran','09:30','daily'],['Work','09:30','daily'],
    ['Asr','15:30','daily'],['Magrib','19:30','daily'],['Isha','21:00','daily'],['Read Quran 10min','22:00','daily'],['Sleep by 11PM','23:00','daily']
  ].map(([name,time,type],i)=>({id:`routine-${i+1}`,name,notes:'',color:'#627477',schedule:schedule(type,'2026-09-01',time)}));
  return {version:1,layout:'mine',sectionCount:6,layerCount:7,sections,extras};
}

let model;
try{model=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(e){model=null;}
if(!model||!Array.isArray(model.sections))model=makeBlankModel();
while(model.sections.length<8)model.sections.push({id:uid(),name:`Section ${model.sections.length+1}`,actions:[]});
model.extras=model.extras||[];

const now=new Date();
let viewMonth=new Date(now.getFullYear(),now.getMonth(),1);
let selectedDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
let editorDaySet=new Set();

function saveModel(){localStorage.setItem(STORAGE_KEY,JSON.stringify(model));}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1400);}
function openOverlay(id){$(id).classList.add('open');}
function closeOverlay(id){$(id).classList.remove('open');}

function layerColor(position,total){
  const a=[26,94,65],b=[132,193,128],t=total<=1?0:(position-1)/(total-1);
  return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;
}
function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
function wedgePath(cx,cy,r0,r1,a0,a1){const p1=polar(cx,cy,r1,a0),p2=polar(cx,cy,r1,a1),p3=polar(cx,cy,r0,a1),p4=polar(cx,cy,r0,a0),large=(a1-a0)>180?1:0;return `M${p1.x},${p1.y} A${r1},${r1} 0 ${large} 1 ${p2.x},${p2.y} L${p3.x},${p3.y} A${r0},${r0} 0 ${large} 0 ${p4.x},${p4.y} Z`;}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function wrapWords(text,max=12){const words=String(text||'').split(/\s+/).filter(Boolean),lines=[];let line='';for(const w of words){const n=line?`${line} ${w}`:w;if(n.length>max&&line){lines.push(line);line=w;}else line=n;}if(line)lines.push(line);return lines.slice(0,3);}
function renderMap(){
  const root=$('mapStage');
  const visibleSections=model.sections.slice(0,model.sectionCount);
  const hasAnything=visibleSections.some(s=>s.actions.slice(0,model.layerCount).length)||visibleSections.some(s=>!/^Section \d+$/.test(s.name));
  if(!hasAnything){root.innerHTML='<div class="blankCircle"><div><strong style="color:#dfe7e8">Blank priority map</strong><br><br>Tap here or Edit map to build it.</div></div>';return;}
  const size=620,c=310,titleInner=82,titleOuter=136,outer=294,L=model.layerCount,N=model.sectionCount,ring=(outer-titleOuter)/L;
  let svg=`<svg class="prioritySvg" viewBox="0 0 ${size} ${size}" aria-label="Priority map">`;
  for(let si=0;si<N;si++){
    const sec=visibleSections[si],a0=si*360/N,a1=(si+1)*360/N,mid=(a0+a1)/2;
    for(let li=1;li<=L;li++){
      const r0=titleOuter+(li-1)*ring,r1=titleOuter+li*ring,act=sec.actions[li-1];
      svg+=`<path class="cell" fill="${layerColor(li,L)}" d="${wedgePath(c,c,r0,r1,a0,a1)}"/>`;
      if(act){const p=polar(c,c,(r0+r1)/2,mid),rot=(mid>90&&mid<270)?mid+180:mid,lines=wrapWords(act.name,13);svg+=`<text class="actionText" text-anchor="middle" transform="translate(${p.x} ${p.y}) rotate(${rot})">`;lines.forEach((ln,j)=>svg+=`<tspan x="0" dy="${j===0?-(lines.length-1)*4.1:8.2}">${esc(ln)}</tspan>`);svg+='</text>';}
    }
    svg+=`<path class="cell" fill="#2b8f92" d="${wedgePath(c,c,titleInner,titleOuter,a0,a1)}"/>`;
    const tp=polar(c,c,(titleInner+titleOuter)/2,mid),trot=(mid>90&&mid<270)?mid+180:mid;
    svg+=`<text class="titleText" text-anchor="middle" transform="translate(${tp.x} ${tp.y}) rotate(${trot})">${esc(sec.name)}</text>`;
  }
  for(let i=0;i<N;i++){const a=i*360/N,p0=polar(c,c,titleInner,a),p1=polar(c,c,outer,a);svg+=`<line class="divider" x1="${p0.x}" y1="${p0.y}" x2="${p1.x}" y2="${p1.y}"/>`;}
  svg+='</svg>';root.innerHTML=svg;
}

function scheduleSummary(s){
  if(!s||s.type==='none')return 'No schedule';
  const tm=s.time?` · ${formatTime(s.time)}`:'';
  if(s.type==='once')return `Once · ${s.startDate||'No date'}${tm}`;
  if(s.type==='daily')return `Every day${tm}`;
  if(s.type==='weekly'){const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return `Every week${s.weekdays?.length?' · '+s.weekdays.map(d=>names[d]).join(', '):''}${tm}`;}
  if(s.type==='custom'){if(s.unit==='week'){const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return `Every ${s.interval||1} week${(s.interval||1)>1?'s':''}${s.weekdays?.length?' · '+s.weekdays.map(d=>names[d]).join(', '):''}${tm}`;}return `Every ${s.interval||1} day${(s.interval||1)>1?'s':''}${tm}`;}
  return 'No schedule';
}
function formatTime(t){if(!t)return 'Any time';const [h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}

function renderSetup(){
  $('sectionCount').value=model.sectionCount;$('layerCount').value=model.layerCount;
  const root=$('sectionEditor');root.innerHTML='';
  model.sections.slice(0,model.sectionCount).forEach((sec,si)=>{
    const card=document.createElement('div');card.className='sectionCard';
    const head=document.createElement('div');head.className='sectionHead';
    const name=document.createElement('input');name.className='sectionName';name.value=sec.name;name.placeholder=`Section ${si+1}`;name.dataset.sectionId=sec.id;name.dataset.action='rename-section';head.appendChild(name);card.appendChild(head);
    sec.actions.slice(0,model.layerCount).forEach((act,ai)=>{
      const row=document.createElement('div');row.className='actionRow';
      row.innerHTML=`<span class="layerDot" style="background:${layerColor(ai+1,model.layerCount)}"></span><div class="actionMain" data-action="edit-action" data-section-id="${esc(sec.id)}" data-action-id="${esc(act.id)}"><div class="actionTitle">${esc(act.name)}</div><div class="scheduleText">${esc(scheduleSummary(act.schedule))}</div></div><div class="rowBtns"><button class="smallBtn" type="button" data-action="move-action-up" data-section-id="${esc(sec.id)}" data-action-id="${esc(act.id)}">↑</button><button class="smallBtn" type="button" data-action="move-action-down" data-section-id="${esc(sec.id)}" data-action-id="${esc(act.id)}">↓</button></div>`;
      card.appendChild(row);
    });
    if(sec.actions.length<model.layerCount){const add=document.createElement('button');add.type='button';add.className='addAction';add.textContent='+ Add actionable';add.dataset.action='add-action';add.dataset.sectionId=sec.id;card.appendChild(add);}else{const full=document.createElement('div');full.className='addAction muted';full.textContent='Actionable layers full';card.appendChild(full);}
    root.appendChild(card);
  });
}

function defaultNewSchedule(){const d=dateKey(selectedDate);return schedule('once',d,'');}
function findAction(sectionId,actionId){const sec=model.sections.find(s=>s.id===sectionId);return {sec,act:sec?.actions.find(a=>a.id===actionId)};}
function openActionEditor(sectionId,actionId=null){
  const {sec,act}=findAction(sectionId,actionId);if(!sec)return;
  $('actionId').value=act?.id||'';$('actionSectionId').value=sec.id;$('actionName').value=act?.name||'';$('actionNotes').value=act?.notes||'';$('deleteActionBtn').style.visibility=act?'visible':'hidden';$('actionEditorTitle').textContent=act?'Edit actionable':'Add actionable';
  const s=clone(act?.schedule||defaultNewSchedule());$('startDate').value=s.startDate||dateKey(selectedDate);$('actionTime').value=s.time||'';$('repeatType').value=s.type||'once';$('repeatEvery').value=s.interval||1;$('repeatUnit').value=s.unit||'day';$('endType').value=s.endType||'never';$('endDate').value=s.endDate||'';editorDaySet=new Set(s.weekdays||[]);renderActionScheduleControls();openOverlay('actionOverlay');setTimeout(()=>$('actionName').focus(),50);
}
function renderActionScheduleControls(){
  const type=$('repeatType').value,unit=$('repeatUnit').value;const weekly=type==='weekly'||(type==='custom'&&unit==='week');$('weeklyBlock').hidden=!weekly;$('customBlock').hidden=type!=='custom';$('endBlock').hidden=type==='none'||type==='once';$('endDateBlock').hidden=$('endBlock').hidden||$('endType').value!=='date';
  document.querySelectorAll('.dayPick').forEach(b=>b.classList.toggle('active',editorDaySet.has(Number(b.dataset.day))));
}
function saveActionFromEditor(){
  const sec=model.sections.find(s=>s.id===$('actionSectionId').value);if(!sec)return;const id=$('actionId').value;let act=sec.actions.find(a=>a.id===id);const name=$('actionName').value.trim();if(!name){toast('Name the actionable');$('actionName').focus();return;}
  const type=$('repeatType').value,start=$('startDate').value||dateKey(selectedDate),unit=$('repeatUnit').value,interval=Math.max(1,Number($('repeatEvery').value)||1);let weekdays=[...editorDaySet].sort();if((type==='weekly'||(type==='custom'&&unit==='week'))&&!weekdays.length){weekdays=[parseDate(start).getDay()];}
  const s={type,startDate:start,time:$('actionTime').value||'',interval,unit,weekdays,endType:$('endType').value,endDate:$('endDate').value||''};
  if(act){act.name=name;act.notes=$('actionNotes').value.trim();act.schedule=s;}else{if(sec.actions.length>=model.layerCount){toast('This section is full');return;}sec.actions.push({id:uid(),name,notes:$('actionNotes').value.trim(),sourceFrequency:'',schedule:s});}
  saveModel();closeOverlay('actionOverlay');renderSetup();renderAll();toast('Saved');
}

function templateOccurs(t,date){
  const s=t.schedule;if(!s||s.type==='none')return false;const start=parseDate(s.startDate);if(!start||date<new Date(start.getFullYear(),start.getMonth(),start.getDate()))return false;if(s.endType==='date'&&s.endDate){const end=parseDate(s.endDate);if(end&&date>new Date(end.getFullYear(),end.getMonth(),end.getDate(),23,59,59))return false;}
  const dd=diffDays(start,date);if(dd<0)return false;if(s.type==='once')return dd===0;if(s.type==='daily')return dd%Math.max(1,s.interval||1)===0;if(s.type==='weekly'){const week=Math.floor(dd/7),days=s.weekdays?.length?s.weekdays:[start.getDay()];return week%Math.max(1,s.interval||1)===0&&days.includes(date.getDay());}if(s.type==='custom'){const n=Math.max(1,s.interval||1);if(s.unit==='day')return dd%n===0;const week=Math.floor(dd/7),days=s.weekdays?.length?s.weekdays:[start.getDay()];return week%n===0&&days.includes(date.getDay());}return false;
}
function activeTemplates(){
  const arr=[];model.sections.slice(0,model.sectionCount).forEach(sec=>sec.actions.slice(0,model.layerCount).forEach((a,i)=>arr.push({...a,color:layerColor(i+1,model.layerCount),kind:'map'})));model.extras.forEach(x=>arr.push({...x,kind:'extra'}));return arr;
}
function tasksForDate(date){
  const key=dateKey(date),seen=new Set(),out=[];for(const t of activeTemplates()){if(!templateOccurs(t,date))continue;const normalized=t.name.trim().toLowerCase();if(seen.has(normalized))continue;seen.add(normalized);out.push({instanceId:`${t.id}|${key}`,templateId:t.id,label:t.name,time:t.schedule.time||'',color:t.color||'#637578',kind:t.kind});}
  if(model.layout==='mine'&&key==='2026-09-04')out.push({instanceId:`special-nap|${key}`,templateId:'special-nap',label:'Nap',time:'06:30',color:'#637578',kind:'extra'});
  return out.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||a.label.localeCompare(b.label));
}
function isDone(id){return localStorage.getItem(DONE_KEY+id)==='1';}function toggleDone(id){const k=DONE_KEY+id;localStorage.setItem(k,isDone(id)?'0':'1');}

function renderCalendar(){
  $('monthTitle').textContent=viewMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});const root=$('monthGrid');root.innerHTML='';const first=new Date(viewMonth.getFullYear(),viewMonth.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const cell=document.createElement('div');cell.className='dayCell'+(d.getMonth()!==viewMonth.getMonth()?' out':'')+(sameDay(d,selectedDate)?' selected':'')+(sameDay(d,now)?' today':'');cell.dataset.action='select-date';cell.dataset.date=dateKey(d);cell.innerHTML=`<div class="dayNum">${d.getDate()}</div>`;const tasks=tasksForDate(d),max=4;tasks.slice(0,max).forEach(t=>{const b=document.createElement('button');b.type='button';b.className='miniTask'+(isDone(t.instanceId)?' done':'');b.style.setProperty('--taskColor',t.color);b.dataset.action='toggle-task';b.dataset.instanceId=t.instanceId;b.dataset.date=dateKey(d);b.innerHTML=`<span class="miniCheck">${isDone(t.instanceId)?'✓':'□'}</span><span class="miniLabel">${esc(t.label)}</span>`;cell.appendChild(b);});if(tasks.length>max){const more=document.createElement('div');more.className='more';more.textContent=`+${tasks.length-max} more`;cell.appendChild(more);}root.appendChild(cell);}
}
function renderTodo(){
  const tasks=tasksForDate(selectedDate),root=$('todoBody');$('todoCount').textContent=`${tasks.filter(t=>isDone(t.instanceId)).length}/${tasks.length}`;root.innerHTML=`<div class="dateHeading">${selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>`;if(!tasks.length){root.innerHTML+='<div class="emptyTodo">No scheduled actionables for this day.</div>';return;}
  let group='';for(const t of tasks){const g=t.time?formatTime(t.time):'Any time';if(g!==group){group=g;const h=document.createElement('div');h.className='timeGroup';h.textContent=g;root.appendChild(h);}const row=document.createElement('button');row.type='button';row.className='todoRow'+(isDone(t.instanceId)?' done':'');row.dataset.action='toggle-task';row.dataset.instanceId=t.instanceId;row.dataset.date=dateKey(selectedDate);row.style.setProperty('--taskColor',t.color);row.innerHTML=`<span class="todoCheck">${isDone(t.instanceId)?'✓':''}</span><span class="todoAccent"></span><span class="todoLabel">${esc(t.label)}</span>`;root.appendChild(row);}
}
function renderAll(){renderMap();renderCalendar();renderTodo();}

function loadMyLayout(){if(!confirm('Replace the current map with My layout?'))return;model=makeMyLayout();saveModel();closeOverlay('settingsOverlay');renderAll();toast('My layout loaded');}
function loadBlankLayout(){if(!confirm('Replace the current map with a blank layout?'))return;model=makeBlankModel();saveModel();closeOverlay('settingsOverlay');renderAll();renderSetup();openOverlay('setupOverlay');}

// One delegated click handler for the whole phone UI.
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='open-settings')openOverlay('settingsOverlay');
  else if(a==='close-settings')closeOverlay('settingsOverlay');
  else if(a==='load-my-layout')loadMyLayout();
  else if(a==='load-blank-layout')loadBlankLayout();
  else if(a==='open-setup'){renderSetup();openOverlay('setupOverlay');}
  else if(a==='setup-done'||a==='setup-home'){saveModel();closeOverlay('setupOverlay');renderAll();}
  else if(a==='add-action')openActionEditor(el.dataset.sectionId);
  else if(a==='edit-action')openActionEditor(el.dataset.sectionId,el.dataset.actionId);
  else if(a==='move-action-up'||a==='move-action-down'){const sec=model.sections.find(s=>s.id===el.dataset.sectionId),i=sec?.actions.findIndex(x=>x.id===el.dataset.actionId)??-1;if(i>=0){const j=a==='move-action-up'?i-1:i+1;if(j>=0&&j<sec.actions.length){[sec.actions[i],sec.actions[j]]=[sec.actions[j],sec.actions[i]];saveModel();renderSetup();renderAll();}}}
  else if(a==='close-action')closeOverlay('actionOverlay');
  else if(a==='pick-day'){const n=Number(el.dataset.day);editorDaySet.has(n)?editorDaySet.delete(n):editorDaySet.add(n);renderActionScheduleControls();}
  else if(a==='save-action')saveActionFromEditor();
  else if(a==='delete-action'){const sec=model.sections.find(s=>s.id===$('actionSectionId').value),id=$('actionId').value;if(sec&&id&&confirm('Delete this actionable?')){sec.actions=sec.actions.filter(x=>x.id!==id);saveModel();closeOverlay('actionOverlay');renderSetup();renderAll();}}
  else if(a==='prev-month'){viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);renderCalendar();}
  else if(a==='next-month'){viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);renderCalendar();}
  else if(a==='today'){selectedDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());viewMonth=new Date(now.getFullYear(),now.getMonth(),1);renderCalendar();renderTodo();}
  else if(a==='select-date'){selectedDate=parseDate(el.dataset.date);viewMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);renderCalendar();renderTodo();$('todoCard').scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='toggle-task'){e.stopPropagation();toggleDone(el.dataset.instanceId);const d=parseDate(el.dataset.date);if(d)selectedDate=d;renderCalendar();renderTodo();}
});

document.addEventListener('change',e=>{
  if(e.target.id==='sectionCount'){const n=Number(e.target.value);if(n<model.sectionCount&&!confirm('Hide the extra sections? Their data will be preserved.')){e.target.value=model.sectionCount;return;}model.sectionCount=n;saveModel();renderSetup();renderAll();}
  else if(e.target.id==='layerCount'){const n=Math.max(1,Math.min(12,Number(e.target.value)||1));if(n<model.layerCount&&!confirm('Hide actionables beyond this layer count? Their data will be preserved.')){e.target.value=model.layerCount;return;}model.layerCount=n;e.target.value=n;saveModel();renderSetup();renderAll();}
  else if(e.target.dataset.action==='rename-section'){const sec=model.sections.find(s=>s.id===e.target.dataset.sectionId);if(sec){sec.name=e.target.value.trim()||'Untitled';saveModel();renderMap();}}
  else if(['repeatType','repeatUnit','endType'].includes(e.target.id))renderActionScheduleControls();
});

// Close sheet overlays by tapping only the dark backdrop.
['settingsOverlay','actionOverlay'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id))closeOverlay(id);}));

renderAll();
// Real default: blank app starts directly on the chart/setup screen.
if(model.layout==='blank'&&!model.sections.slice(0,model.sectionCount).some(s=>s.actions.length)){renderSetup();openOverlay('setupOverlay');}
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}
</script>
